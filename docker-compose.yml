version: '3.8'

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-medical-qa
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - VECTORSTORE_PATH=/app/src/vectorstore/faiss_index
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-models/embedding-001}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - PORT=8000
    volumes:
      # Mount vectorstore directory to persist index
      - ./src/vectorstore:/app/src/vectorstore
      # Mount data directory for PDFs (optional for runtime)
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a simple nginx reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - rag-api
